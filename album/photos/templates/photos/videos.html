{% extends 'photos/home.html' %}
{% load static %}

{%  block content %}


<div class="Project-container">
    <div class="container-fluid">
    <div class="row">
    <div class="col text-center p-4">
    {% comment %} <h3 class="font-weight-bolder">GELLARY</h3> {% endcomment %}
  </div>
  </div>
  </div>

<div class="row p-4 g-4">

{% for c in image %}
<div class="col-md-3">
<div class="card-body">
<!-- <a href="{{ c.image.url }}" data-lightbox="image-1" data-title="My caption"></a> -->
<img src="{{ c.image_thumbnail.url }}" class="img-fluid" alt="">
<p class="card-text">{{ c.title }}</p>   
<a href="{{ c.http_link }}" class="btn btn-outline-danger text-wrap col-12 mx-auto"><span class="text-danger-emphasis">View Video</span></a>
</div>
</div>
{% endfor %}
</div>
</div>


{%  endblock content %}
