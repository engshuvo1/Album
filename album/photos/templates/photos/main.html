{% extends 'photos/home.html' %}
{% load static %}
{% load crispy_forms_tags %}

{%  block content %}

<div class="container"style="margin-top = 100px;">
    <h4 class="text-center text-danger my-4">ADD VIDEO</h4>
    <div class="col-9 shadow-lg mx-auto">
    <div class="row">
        <div class="card">
            <form action="" method="POST", enctype="multipart/form-data">
            {% if messages %}
            {% for message in messages %}
            <p {% if message.tags %} class="bg-{{ message.tags }} text-white py-2 text-center"{% endif %}>{{ message }}</p>
            {% endfor %}
            {% endif %}

                {% csrf_token %}
                {{ forms|crispy }}

            <button type="submit" class="btn btn-outline-danger text-wrap col-12 mx-auto">ADD VIDEO</button>
            </form>
        </div>
        </div>
    </div>
</div>
 
{%  endblock content %}
